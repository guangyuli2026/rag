#理解项目名称、依赖和命令入口
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-learning-assistant"
version = "0.1.0"
description = "A small, traceable RAG learning project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

#本质调用main()
[project.scripts]
rag-demo = "rag_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
